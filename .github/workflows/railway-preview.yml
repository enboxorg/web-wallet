name: Preview Deploy to Railway

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches-ignore:
      - main
      - master

jobs:
  deploy-preview:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      PREVIEW_ENV: preview-${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview environment
        run: |
          ENV_SLUG=$(echo "$PREVIEW_ENV" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//; s/-$//')
          echo "Using environment: $ENV_SLUG"
          railway up --project $RAILWAY_PROJECT_ID --service $RAILWAY_SERVICE_ID --environment "$ENV_SLUG"
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      PREVIEW_ENV: preview-${{ github.head_ref || github.ref_name }}
    steps:
      - name: Cleanup preview environment
        run: |
          ENV_SLUG=$(echo "$PREVIEW_ENV" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//; s/-$//')
          echo "Deleting environment: $ENV_SLUG"
          railway env delete --project $RAILWAY_PROJECT_ID --yes "$ENV_SLUG" || echo "Environment not found, skipping"